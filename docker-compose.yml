name: multi-agent-debate

services:
  ollama:
    image: ollama/ollama:latest
    container_name: multi-agent-debate-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 2
      OLLAMA_MAX_LOADED_MODELS: 3
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama_data:/root/.ollama
      # Optional: expose LM Studio GGUF files to custom model creation.
      # Override LMSTUDIO_MODELS on another machine if needed.
      - ${LMSTUDIO_MODELS:-C:/Users/husna/.lmstudio/models}:/lm-models:ro

  model-init:
    image: ollama/ollama:latest
    container_name: multi-agent-debate-model-init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama:/bootstrap:ro
      - ${LMSTUDIO_MODELS:-C:/Users/husna/.lmstudio/models}:/lm-models:ro
    entrypoint: ["/bin/sh", "/bootstrap/init-models.sh"]
    profiles:
      - models

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: multi-agent-debate-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      MODEL_PROVIDER: openai
      BASE_URL: http://ollama:11434/v1
      API_KEY: ollama
      # Set DOCKER_GROQ_KEY explicitly if you want Groq options in Docker.
      GROQ_KEY: ${DOCKER_GROQ_KEY:-}
    volumes:
      - ./backend/data:/app/backend/data
      - ./results:/app/results
      - ./Documents:/app/Documents:ro
    depends_on:
      - ollama

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: multi-agent-debate-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8001
    depends_on:
      - backend

volumes:
  ollama_data:
